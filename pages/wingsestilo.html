<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WINGS ESTILO</title>
        <!-- css -->
        <link rel="stylesheet" href="wingsestilo-header.css" />
        <link rel="stylesheet" href="wingsestilo-home.css" />
        <!-- boxicons -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/boxicons@latest/css/boxicons.min.css"
        />

        <!-- fonts -->
        <!-- cinzel -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- cinzel-decorative -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <!-- quicksand -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- HEADER  -->
        <header>
            <nav>
                <div class="logo">
                    <h1>WINGS ESTILO</h1>
                </div>

                <ul class="nav-middle">
                    <li class="nav-li"><a href="#" class="nav-a">SHOP</a></li>
                    <li class="nav-li categories-dropbtn">
                        <a href="#" class="nav-a">
                            CATEGORIES
                            <i class="bx bxs-chevron-down"></i>
                        </a>

                        <div class="categories-dropdown">
                            <div class="navArea">
                                <ul>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/gowns.png')  
                                            "
                                            >Ball Gowns</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/long-dress.jpeg')  
                                            "
                                            >Long Dress</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/short-dress.jpeg')  
                                            "
                                            >Short Dress</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/sarees.jpeg')  
                                            "
                                            >Sarees</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/lehenga.jpeg')  
                                            "
                                            >Lehenga</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            href="#"
                                            onmouseenter="
                                            changeImage('../public/assets/imgaes/categories/kids.jpeg')  
                                            "
                                            >Kids</a
                                        >
                                    </li>
                                </ul>
                            </div>

                            <div class="imgArea">
                                <img
                                    src="../public/assets/imgaes/categories/gowns.png"
                                    alt=""
                                    id="slider"
                                />
                            </div>
                        </div>
                    </li>
                    <li class="nav-li">
                        <a href="#" class="nav-a">CONTACT</a>
                    </li>
                    <li class="nav-li">
                        <a href="#" class="nav-a">ABOUT US</a>
                    </li>
                </ul>

                <ul class="nav-right">
                    <li class="nav-li">
                        <a href="#" class="nav-a">
                            <i class="bx bx-shopping-bag bag"></i>
                            Bag
                        </a>
                    </li>
                    <li class="nav-li">
                        <a href="#" class="nav-a">
                            <i class="bx bx-heart heart"></i>
                            Wishlist
                        </a>
                    </li>
                    <li class="profile-dropbtn nav-li">
                        <a href="#" class="nav-a">
                            <i class="bx bx-user user"></i>
                            Profile
                        </a>
                        <div class="profile-dropdown">
                            <p class="profile-dropdown-p1">Welcome</p>
                            <p class="profile-dropdown-p2">
                                To access account and manage orders
                            </p>
                            <button>Log in</button>
                            <button>Sign up</button>
                        </div>
                    </li>
                </ul>
            </nav>
        </header>

        <!-- HOME SECTION -->

        <section class="home-section">
            <div class="home-img-div">
                <img src="../public/assets/imgaes/home-img1.png" alt="" />
            </div>
        </section>

        <!-- CATEGORY SECTION -->

        <section class="category-section">
            <div class="ct-h1">
                <h1>Shop by Category</h1>
            </div>

            <div class="ct-grid">
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/GOWNS.png"
                        alt=""
                    />
                </a>
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/long-dress.jpeg"
                        alt=""
                    />
                </a>
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/short-dress.jpeg"
                        alt=""
                    />
                </a>
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/lehenga.jpeg"
                        alt=""
                    />
                </a>
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/maternity-dress.jpg"
                        alt=""
                    />
                </a>
                <a href="#" class="ct">
                    <img
                        src="../public/assets/imgaes/categories/kids.jpeg"
                        alt=""
                    />
                </a>
            </div>
        </section>

        <section class="banner">
            <img
                src="../public/assets/imgaes/green ball gown.png"
                alt=""
                id="green"
            />
        </section>

        <!-- <section class="explore">
            <div class="explore-h1">
                <h1>Explore</h1>
            </div>

            <div class="ex-grid"></div>
        </section> -->

        <script>
            function changeImage(anything) {
                document.getElementById("slider").src = anything;
            }
        </script>
    </body>
</html>
